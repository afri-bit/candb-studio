name: Feature request
description: New capability or improvement — this issue is the brief for humans and Cursor
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is the **source of truth**. Write it so Cursor (or a human) can specify and implement without a side chat.

        Fuzzy ideas belong in [Discussions](https://github.com/afri-bit/candb-studio/discussions) first. Workflow: `docs/workflow/README.md`.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is awkward, missing, or slow today? Who is affected?
      placeholder: e.g. I need to compare two DBCs side by side when merging OEM updates…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working (UI, commands, file formats). Rough ideas are fine; keep it about what and why.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable outcomes. An agent is done when every item is true.
      placeholder: |
        - [ ] User can …
        - [ ] Given …, when …, then …
        - [ ] Out of scope is not implemented
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this issue must not include. Prevents drive-by scope.
      placeholder: e.g. No new CAN adapter vendors. No Marketplace release work.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or simpler variants.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - DBC editing (custom editor / webview)
        - Signal Lab (monitor / transmit / charts)
        - Explorer / tree
        - Language features
        - Parser / serialization / round-trip
        - Bus adapters
        - Documentation / onboarding
        - Workflow / repo process
        - Other
    validations:
      required: true

  - type: dropdown
    id: spec
    attributes:
      label: Speckit
      description: Features that add user-visible capability should get a specs/ folder.
      options:
        - Needs spec (label needs-spec after triage)
        - Spec already exists (link below)
        - No spec — small, localized change
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: Related discussion, spec, or ADR
      description: URLs or paths, e.g. discussions/12 or specs/006-dbc-side-by-side-compare/
      placeholder: https://github.com/afri-bit/candb-studio/discussions/…

  - type: checkboxes
    id: agent_ready
    attributes:
      label: Ready for an agent
      description: Check only when the fields above are complete enough to implement or run /speckit.specify.
      options:
        - label: This issue is a complete brief (add label agent-ready after submit if you have triage rights)

  - type: textarea
    id: contribution
    attributes:
      label: Contribution
      description: Say if you will open a PR, want a Cloud Agent run, or need implementation guidance.
